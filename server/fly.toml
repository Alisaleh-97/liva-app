# Fly.io deployment config for the LIVA backend.
# Deploy:  fly launch --no-deploy   (first time — creates the app)
#          fly secrets set JWT_SECRET=... DATABASE_URL=... OPENAI_API_KEY=...
#          fly deploy

app = "liva-api"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3001"
  NODE_ENV = "production"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"     # save $ — spins down when idle
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[http_service.concurrency]
  type = "requests"
  hard_limit = 250
  soft_limit = 200

# Health check — Fly won't send traffic to a machine that fails this
[[http_service.checks]]
  grace_period = "10s"
  interval     = "30s"
  method       = "GET"
  path         = "/health"
  timeout      = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus     = 1
  memory   = "256mb"

# Persistent volume for the SQLite DB + uploaded images. In real prod you'd
# swap SQLite for managed Postgres and images for S3/Cloudinary — see .env.
[mounts]
  source      = "liva_data"
  destination = "/app/data"
