<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LIVA — Live · Shop · Earn</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #08060f;
    background-image: radial-gradient(80% 60% at 50% 0%, #1a1330 0%, #08060f 60%);
    min-height: 100vh; display: grid; place-items: center;
    font-family: 'Manrope', sans-serif; padding: 24px;
  }
  #root { transform-origin: center; }
  button { font-family: inherit; }

  /* hide scrollbars inside the app */
  .hscroll::-webkit-scrollbar, .liva-screen::-webkit-scrollbar { display: none; }
  .hscroll, .liva-screen { -ms-overflow-style: none; scrollbar-width: none; }
  .liva-screen { overscroll-behavior: contain; }
  input::placeholder { color: var(--text-dim); }

  /* live pulse dot */
  @keyframes liva-pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
  .liva-pulse { animation: liva-pulse 1.4s ease-in-out infinite; }

  /* live-tab ring */
  @keyframes liva-ring { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(1.35); } }
  .liva-ring { animation: liva-ring 1.8s ease-out infinite; }

  /* message drip-in (transform-only so content is never held invisible) */
  @keyframes liva-msg-in { from { transform: translateY(9px); } to { transform: translateY(0); } }
  .liva-msg-in { animation: liva-msg-in .32s cubic-bezier(.32,.72,0,1); }

  /* floating heart */
  @keyframes liva-heart { 0% { opacity: 1; transform: translateY(0) scale(.6); } 30% { transform: translateY(-40px) scale(1.1); } 100% { opacity: 0; transform: translateY(-150px) scale(.9); } }
  .liva-heart { animation: liva-heart 1.4s ease-out forwards; }

  /* typing dots */
  @keyframes liva-typing { 0%,60%,100% { opacity: .3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
  .liva-typing-dot { animation: liva-typing 1.1s ease-in-out infinite; }

  /* screen fade */
  @keyframes liva-fade { from { opacity: 0; } to { opacity: 1; } }
  .liva-fade { animation: liva-fade .26s ease; }

  /* success pop */
  @keyframes liva-pop { 0% { transform: scale(.4); opacity: 0; } 60% { transform: scale(1.12); } 100% { transform: scale(1); opacity: 1; } }
  .liva-pop { animation: liva-pop .5s cubic-bezier(.32,1.4,.5,1); }

  /* AI re-rank shuffle */
  @keyframes liva-reorder { 0% { opacity: 1; } 40% { opacity: .25; transform: scale(.985); } 100% { opacity: 1; transform: scale(1); } }
  .liva-reorder { animation: liva-reorder .9s ease; }

  /* range slider */
  .liva-range { -webkit-appearance: none; appearance: none; height: 5px; border-radius: 99px; background: var(--surface-2); outline: none; }
  .liva-range::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--accent1); cursor: pointer; box-shadow: 0 2px 8px -2px var(--accent1); border: 2px solid var(--bg); }
  .liva-range::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--accent1); cursor: pointer; border: 2px solid var(--bg); }
</style>
</head>
<body>
  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#EC4899"/></linearGradient></defs>
      <rect width="100" height="100" rx="22" fill="#0D0A16"/>
      <text x="50" y="62" font-family="sans-serif" font-size="40" font-weight="800" fill="url(#g)" text-anchor="middle">L</text>
    </svg>
  </template>

  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="frames/image-slot.js"></script>

  <script type="text/babel" src="frames/ios-frame.jsx"></script>
  <script type="text/babel" src="frames/tweaks-panel.jsx"></script>
  <script type="text/babel" src="app/theme.jsx"></script>
  <script type="text/babel" src="app/i18n.jsx"></script>
  <script type="text/babel" src="app/data.jsx"></script>
  <script type="text/babel" src="app/components.jsx"></script>
  <script type="text/babel" src="app/cards.jsx"></script>
  <script type="text/babel" src="app/home.jsx"></script>
  <script type="text/babel" src="app/live.jsx"></script>
  <script type="text/babel" src="app/shop.jsx"></script>
  <script type="text/babel" src="app/earn.jsx"></script>
  <script type="text/babel" src="app/ai.jsx"></script>
  <script type="text/babel" src="app/pdp.jsx"></script>
  <script type="text/babel" src="app/search.jsx"></script>
  <script type="text/babel" src="app/wishlist.jsx"></script>
  <script type="text/babel" src="app/tracking.jsx"></script>
  <script type="text/babel" src="app/checkout.jsx"></script>
  <script type="text/babel" src="app/app.jsx"></script>

  <script>
    // scale the device frame to fit the viewport
    function fitDevice() {
      const root = document.getElementById('root');
      if (!root || !root.firstElementChild) return;
      const dh = 874, dw = 402;
      const pad = 48;
      const s = Math.min((window.innerWidth - pad) / dw, (window.innerHeight - pad) / dh, 1);
      root.style.transform = `scale(${s})`;
    }
    window.addEventListener('resize', fitDevice);
    const obs = new MutationObserver(fitDevice);
    obs.observe(document.getElementById('root'), { childList: true, subtree: true });
    setTimeout(fitDevice, 300);
  </script>
</body>
</html>
